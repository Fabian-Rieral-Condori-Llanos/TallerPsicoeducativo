
version: '3.8'
services:
  frontend-new:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"  # HTTP port
      - "8443:8443"  # HTTPS port
    networks:
      - app-network
    restart: unless-stopped
    container_name: frontend-new-app

networks:
  app-network:
    driver: bridge